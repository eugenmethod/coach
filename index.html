<style>
  /* Layout: a dark coach's desk — sticky wordmark bar, one working column of panels; rose gold marks only what needs action or the number that matters. */
  :root {

    --warn: #e9c47e;
    --crit: #ec8a78;
    --display: "Anton", "Impact", "Arial Narrow", sans-serif;

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }

  .top-in { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; font-size: 19px; }
  .brand small { font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: var(--muted); text-transform: uppercase; }
  nav { display: flex; gap: 6px; margin-left: auto; }
  .nav-b { background: none; border: 1px solid transparent; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
  .nav-b[aria-current="page"] { color: var(--bone); border-color: var(--rose-line); }

  .wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 96px; display: flex; flex-direction: column; gap: 22px; }
  h1, h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(34px, 6vw, 54px); line-height: 0.95; }
  h2 { font-size: 22px; line-height: 1.1; }

  .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

  .chip { background: none; border: 1px solid var(--faint); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--ink); background: var(--rose); border-color: var(--rose); }

  input, select, textarea { background: var(--ink); border: 1px solid var(--faint); border-radius: 10px; padding: 9px 11px; font-size: 15px; font-weight: 500; letter-spacing: 0; text-transform: none; width: 100%; min-width: 0; }

  .ov { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.7); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 40px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(16px, env(safe-area-inset-left, 0px)); }

  .mx:hover { border-color: var(--rose-line); color: var(--rose); }

  .ov, .picker { overscroll-behavior: contain; }

  @media (prefers-reduced-motion: reduce) { .ov > .modal, .picker > .pk, .toast { animation: none; } }
  .exb-n, #lex { cursor: pointer; }

  .picker { position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
  .pk { width: 100%; max-width: 640px; height: min(720px, 100%); background: var(--panel); border: 1px solid var(--rose-line); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; }
